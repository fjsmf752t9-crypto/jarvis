<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>

    <style>
        body {
            background: #050505;
            color: #00eaff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 22px;
        }

        input {
            width: 70%;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #00eaff;
            background: #111;
            color: white;
        }

        button {
            padding: 15px 25px;
            margin-left: 10px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🤖 JARVIS</h1>
    <p>JARVIS IS ONLINE</p>

    <input id="question" type="text" placeholder="Ask JARVIS something...">
    <button onclick="askJarvis()">Ask</button>

    <p id="answer"></p>

    <script>      

async function askJarvis() {
    const question = document.getElementById("question").value.trim();
    const answer = document.getElementById("answer");

    if (!question) {
        answer.innerText = "Please ask me something.";
        return;
    }

    answer.innerText = "JARVIS is thinking...";

    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: question })
        });

        const data = await response.json();
        answer.innerText = data.answer || "JARVIS couldn't get an answer.";
    } catch (error) {
        answer.innerText = "Connection failed. Please try again.";
    }
}
</script>

</body>
</html>
