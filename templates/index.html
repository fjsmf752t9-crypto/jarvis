<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>

    <style>
        body {
            background: #050505;
            color: #00eaff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 22px;
        }

        input {
            width: 70%;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #00eaff;
            background: #111;
            color: white;
        }

        button {
            padding: 15px 25px;
            margin-left: 10px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🤖 JARVIS</h1>
    <p>JARVIS IS ONLINE</p>

<input id="question" type="text" placeholder="Message JARVIS..." onkeydown="if(event.key==='Enter') askJarvis()">
<button onclick="askJarvis()">Ask</button>
<button onclick="startListening()">🎤 Talk</button>
<div id="chat"></div>
<button onclick="clearChat()">Clear Chat</button>
    
<script>
async function askJarvis() {
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const question = input.value.trim();

    if (!question) return;

    // Show your question and clear the input
    const userMessage = document.createElement("p");
    userMessage.textContent = "You: " + question;
    chat.appendChild(userMessage);
    input.value = "";

    // Show JARVIS thinking
    const botMessage = document.createElement("p");
    botMessage.textContent = "JARVIS: Thinking...";
    chat.appendChild(botMessage);

    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: question })
        });

        const data = await response.json();
        botMessage.textContent =
            "JARVIS: " + (data.answer || "I couldn't get an answer.");
    } catch (error) {
        botMessage.textContent =
            "JARVIS: Connection failed. Please try again.";
        
    }input.focus();
}
</script>
